<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자비스 식대 변경 미리보기</title>
<style>
*{box-sizing:border-box}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#172b40;background:#f3f6f9;margin:28px}h1{font-size:28px;margin-bottom:10px}p{color:#526276;line-height:1.7}.cards{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0}.cards div{background:white;border:1px solid #e1e8ef;border-radius:12px;padding:18px 24px;min-width:135px}.cards b{display:block;font-size:28px;margin-bottom:5px}.toolbar{background:#fff;border:1px solid #dce5ee;border-radius:12px;padding:18px;margin-bottom:20px}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.actions strong{font-size:18px;margin-right:8px}input,select,button{font:inherit}input:not([type=checkbox]),select{padding:9px;border:1px solid #b9c7d6;border-radius:6px;background:white}button{padding:10px 16px;border:1px solid #b8c8d6;border-radius:7px;background:white;cursor:pointer}button.primary{background:#14654f;color:white;border-color:#14654f}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5b9be0;outline-offset:2px}#message{margin:12px 0 0}#message.error{color:#b03026}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}#q{min-width:265px}.table{overflow:auto;background:white;border:1px solid #e0e7ef;border-radius:10px;max-height:65vh}table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}th,td{padding:12px;border-bottom:1px solid #e5eaf0;text-align:left}th{background:#e9f0f6;position:sticky;top:0;z-index:2}th:first-child{left:0;z-index:4}td.choice{position:sticky;left:0;z-index:1;background:#fff;min-width:170px;border-right:1px solid #dce5ee}tr[data-status=review]{background:#fff8e6}tr[data-status=change]{background:#f2faf6}tr[data-selected=true] td.choice{background:#edf8f2}td:last-child{white-space:normal;min-width:260px}.switch{display:inline-block;position:relative;width:38px;height:22px;vertical-align:middle;margin-right:9px}.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}.switch span{display:block;width:100%;height:100%;border-radius:14px;background:#adb9c5;transition:background .15s}.switch span:after{content:"";display:block;position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:white;transition:transform .15s}.switch input:checked+span{background:#167458}.switch input:checked+span:after{transform:translateX(16px)}.switch input:disabled{cursor:default}.switch input:disabled+span{opacity:.4}.switch input:focus-visible+span{outline:3px solid #5b9be0;outline-offset:3px}.manual{margin-top:12px}.manual label{display:block;margin-top:8px}.manual input{width:82px}.manual select{width:82px}#offline{background:#fff3da;border-radius:8px;padding:12px 16px}.muted{color:#64758a;font-size:13px}@media(max-width:600px){body{margin:16px}.cards div{min-width:calc(50% - 7px);padding:14px}h1{font-size:23px}.table{max-height:60vh}}
</style>
<h1>자비스 식대 변경 미리보기</h1>
<p>__TITLE__ · 영수증별로 적용 여부를 선택하세요. 선택 저장 후 프로그램 메뉴 3번에서 자비스에 적용합니다.</p>
<div class="cards">__CARDS__</div>
<p id="offline" hidden>저장된 미리보기입니다. 선택을 바꾸려면 프로그램에서 <b>5 최근 미리보기 다시 열기</b>를 선택하세요.</p>
<div class="toolbar">
  <div class="actions"><strong id="summary"></strong><button id="save" class="primary" disabled>선택 저장</button><button id="all-off">전체 선택 해제</button><button id="reset">검사 기본값으로</button></div>
  <p id="message" role="status" aria-live="polite"></p>
  <p class="muted">대상 제외 항목을 켜면 식대 종류와 인원을 직접 확인해야 합니다. 예정금액은 기존 금액과 식대 한도 중 작은 금액이며, 사용목적은 식비입니다. 확인 필요·기준 충족 항목은 선택할 수 없습니다.</p>
</div>
<div class="filters"><input id="q" aria-label="영수증 검색" placeholder="이름·메모·영수증ID 검색"><select id="s" aria-label="검사 분류"><option value="">전체 상태</option><option value="change">수정 예정</option><option value="review">확인 필요</option><option value="keep">기준 충족</option><option value="excluded">대상 제외</option></select><label><input id="chosen-only" type="checkbox"> 선택한 항목만 보기</label><span id="visible-count" class="muted"></span></div>
<div class="table"><table><thead><tr>__HEAD__</tr></thead><tbody>__BODY__</tbody></table></div>
<script id="preview-data" type="application/json">__DATA__</script>
<script>
const data=JSON.parse(document.getElementById('preview-data').textContent);
const entries=new Map(data.entries.map(e=>[e.id,e]));
const rows=[...document.querySelectorAll('tbody tr')];
const save=document.getElementById('save'),message=document.getElementById('message');
let saved=data.selection,revision=data.revision,busy=false,dirty=false;
const editable=Boolean(data.endpoint)&&location.protocol==='http:';
function selection(){
  const selected_ids=[],overrides={};
  for(const row of rows){
    if(!row.querySelector('.apply-toggle').checked)continue;
    selected_ids.push(row.dataset.id);
    if(row.dataset.status==='excluded')overrides[row.dataset.id]={kind:row.querySelector('.kind').value,count:row.querySelector('.people').valueAsNumber};
  }
  return {schema:1,plan_hash:saved.plan_hash,selected_ids,overrides};
}
function restore(value){
  const chosen=new Set(value.selected_ids);
  for(const row of rows){
    row.querySelector('.apply-toggle').checked=chosen.has(row.dataset.id);
    const manual=value.overrides[row.dataset.id],people=row.querySelector('.people');
    if(people){people.value=manual?manual.count:'';row.querySelector('.kind').value=manual?manual.kind:'lunch';}
  }
}
function filter(){
  const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('s').value,chosen=document.getElementById('chosen-only').checked;
  let shown=0;
  rows.forEach(row=>{row.hidden=!(row.textContent.toLowerCase().includes(q)&&(!s||row.dataset.status===s)&&(!chosen||row.querySelector('.apply-toggle').checked));if(!row.hidden)shown++;});
  document.getElementById('visible-count').textContent=`표시 ${shown}건 / 전체 ${rows.length}건`;
}
function update(){
  let selected=0,manualCount=0,invalid=0;
  for(const row of rows){
    const e=entries.get(row.dataset.id),on=row.querySelector('.apply-toggle').checked,manual=row.querySelector('.manual');
    row.dataset.selected=String(on);if(on)selected++;
    row.querySelector('.choice-label').textContent=on?'적용':(e.decision.action==='keep'?'기준 충족':e.decision.action==='review'?'확인 필요':'제외');
    if(manual)manual.hidden=!on;
    if(e.decision.action!=='excluded')continue;
    let target=e.decision.target,count=e.decision.count,purpose=e.purpose,reason=e.decision.reason;
    if(on&&manual){
      manualCount++;const kind=row.querySelector('.kind').value,input=row.querySelector('.people');count=input.valueAsNumber;
      input.max=kind==='night'?'1':'100';
      const valid=Number.isInteger(count)&&count>=1&&count<=Number(input.max);
      input.setAttribute('aria-invalid',String(!valid));
      if(valid){const limit=kind==='night'?data.settings.night_limit:data.settings.lunch_limit*count;target=Math.min(e.amount,limit);purpose='식비';reason=`사용자가 ${kind==='night'?'야간':'점심'} ${count}명으로 확인 / 한도 ${limit.toLocaleString('ko-KR')}원`;}
      else{invalid++;target=null;count=null;purpose='식비';reason='적용할 식대 종류와 인원을 입력하세요.';}
    }
    row.querySelector('[data-field=target]').textContent=target??'—';row.querySelector('[data-field=count]').textContent=count??'—';row.querySelector('[data-field=purpose]').textContent=purpose;row.querySelector('[data-field=reason]').textContent=reason;
  }
  dirty=JSON.stringify(selection())!==JSON.stringify(saved);
  document.getElementById('summary').textContent=`적용 선택 ${selected}건 · 제외에서 추가 ${manualCount}건`;
  save.disabled=!editable||busy||!dirty||invalid>0;
  message.className=invalid?'error':'';
  message.textContent=invalid?`인원을 확인할 항목 ${invalid}건이 있습니다.`:dirty?'선택이 바뀌었습니다. 선택 저장을 눌러 반영하세요.':'저장된 선택입니다. 프로그램 메뉴 3번에서 적용할 수 있습니다.';
  filter();
}
restore(saved);update();
document.getElementById('offline').hidden=editable;
if(!editable){for(const control of document.querySelectorAll('.toolbar button,.choice input,.choice select'))control.disabled=true;message.textContent='저장된 선택을 표시하고 있습니다.';}
for(const row of rows){row.addEventListener('change',update);row.addEventListener('input',update);}
document.getElementById('q').oninput=filter;document.getElementById('s').onchange=filter;document.getElementById('chosen-only').onchange=filter;
document.getElementById('all-off').onclick=()=>{for(const row of rows)row.querySelector('.apply-toggle').checked=false;update();};
document.getElementById('reset').onclick=()=>{restore({selected_ids:data.entries.filter(e=>e.decision.action==='change').map(e=>e.id),overrides:{}});update();};
save.onclick=async()=>{
  const choice=selection();busy=true;update();message.textContent='선택을 저장하고 있습니다…';
  document.querySelectorAll('.toolbar button,.choice input,.choice select').forEach(e=>{e.dataset.wasDisabled=String(e.disabled);e.disabled=true;});
  try{
    const response=await fetch(data.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selection:choice,revision})});
    const result=await response.json();if(!response.ok)throw new Error(result.error||'선택 저장에 실패했습니다.');
    saved=result.selection;revision=result.revision;restore(saved);dirty=false;
    message.textContent=`선택 ${result.summary.selected}건 저장 완료. 프로그램 메뉴 3번에서 적용하세요.`;
  }catch(error){message.className='error';message.textContent=`선택 저장을 확인할 수 없습니다: ${error.message} 프로그램이 실행 중인지 확인하고, 새로고침하여 저장된 선택을 확인하세요.`;}
  finally{busy=false;document.querySelectorAll('[data-was-disabled]').forEach(e=>{e.disabled=e.dataset.wasDisabled==='true';delete e.dataset.wasDisabled;});save.disabled=!dirty;}
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></html>
